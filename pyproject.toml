[project]
name = "mflux-schedulers"
version = "0.1.0"
description = "Extra schedulers for the mflux project to support image generation models on Apple MLX framework. Namespace mflux.contrib.schedulers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{name = "mflux community", email = "pls-file-gh-issue@users.noreply.github.com"}]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
